name: Build AIOGRAM APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Check Telegram API credentials
        shell: bash
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "::error::Add APP_ID and APP_HASH in Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Accept Android SDK licenses and install SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +e
          yes | "$SDKMANAGER" --licenses
          SDK_STATUS=${PIPESTATUS[1]}
          set -e
          if [ "$SDK_STATUS" -ne 0 ]; then
            exit "$SDK_STATUS"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm yasm meson gperf pkg-config golang-go

      - name: Install Rust targets for wallet engine
        working-directory: TMessagesProj/jni/wallet-engine
        run: |
          rustup target add armv7-linux-androideabi aarch64-linux-android

      - name: Build AIOGRAM
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          GRADLE_OPTS: -Xmx5g -XX:MaxMetaspaceSize=1g
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PAPP_ID="$APP_ID" -PAPP_HASH="$APP_HASH" assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIOGRAM-APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
          retention-days: 14
